name: Build YouTube Clone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK License
      run: yes | sdkmanager --licenses || true

    - name: Install Build Tools
      run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 || true
        echo "---"
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug APK not found"
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "No APK outputs"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: YouTubeClone-debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: warn
