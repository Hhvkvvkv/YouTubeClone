name: Build YouTube Clone APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK License
      run: yes | sdkmanager --licenses || true

    - name: Install Build Tools
      run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore app/release.keystore \
          -alias videoplus -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass 123456 -keypass 123456 \
          -dname "CN=VideoPlus, OU=Dev, O=VideoPlus, L=Cairo, ST=Egypt, C=EG"

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Build Release APK
      run: |
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Verify APKs exist
      run: |
        echo "=== Debug APK ==="
        ls -la app/build/outputs/apk/debug/*.apk 2>/dev/null || echo "NOT FOUND"
        echo "=== Release APK ==="
        ls -la app/build/outputs/apk/release/*.apk 2>/dev/null || echo "NOT FOUND"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: VideoPlus-Debug
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
        if-no-files-found: error

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: VideoPlus-Release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
        if-no-files-found: warn
